# Every PR runs complete ordinary Linux tests and all compile profiles.
# Integration reuses these same jobs on trusted pushes, nightly and manual runs.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  # Keep this distinct from the caller so a reusable run cannot cancel it.
  group: linux-ci-${{ github.ref }}-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  root:
    name: Linux / root-${{ matrix.group }}
    runs-on: ubuntu-latest
    # Existing full-root bounds remain cold/hang backstops, not timing claims.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [pages-first, pages-remaining, controlplane-first, controlplane-remaining, compiler-first, testwriter-remaining, designeval, cli-first, cli-remaining, other-plain, other-concurrency]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.group != 'designeval'
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Install page test dependencies
        if: matrix.group != 'designeval'
        run: npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
      - name: Prefetch fixed compiler fixture inputs
        if: matrix.group == 'controlplane-first' || matrix.group == 'controlplane-remaining' || matrix.group == 'other-concurrency'
        env:
          ROOT_GROUP: ${{ matrix.group }}
        run: |
          GOWORK=off go mod download </dev/null
          if [ "$ROOT_GROUP" = controlplane-first ] || [ "$ROOT_GROUP" = controlplane-remaining ]; then
            GOWORK=off go -C internal/testmodule/testdata/goa-goaai-dsl mod download all </dev/null
            GOWORK=off go -C internal/testmodule/testdata/goa-goaai-evaluator mod download all </dev/null
          else
            GOWORK=off go -C internal/project/testdata/story-fixture mod download all </dev/null
            GOWORK=off go -C internal/project/testdata/story-evaluator mod download all </dev/null
          fi
      - name: Run the full root group
        env:
          ROOT_GROUP: ${{ matrix.group }}
        run: |
          bash .github/scripts/test-root.sh "$ROOT_GROUP" </dev/null \
            | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"

  small-modules:
    name: Linux / Story and Orders evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: story-go
        with:
          go-version-file: story/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.story-go.outputs.go-version }}
      - name: Run all Story tests
        working-directory: story
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 3m -json -- ./... </dev/null
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: evaluator-go
        with:
          go-version-file: examples/orders-eval/go.mod
          cache: false
      - name: Run all ordinary Orders evaluator tests
        working-directory: examples/orders-eval
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 20m -json -- ./... </dev/null

  orders:
    name: Linux / Orders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: examples/orders/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Run all ordinary Orders tests
        working-directory: examples/orders
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 20m -json -- ./... </dev/null

  profiles:
    name: Linux / build profiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Build products and vet every added profile
        # Preserve product linking and test-file vet for every profile.
        # docker alone adds no files: the real container profile needs both tags.
        run: |
          go build ./... </dev/null
          for profile in e2e scaffold herdr browser e2e,docker; do
            go build -tags "$profile" ./... </dev/null
            go vet -tags "$profile" ./... </dev/null
          done

  generated:
    name: Linux / generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: compiler-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Check production concurrency ownership
        run: |
          bash .github/scripts/go-test_test.sh </dev/null
          go run ./.github/scripts/racecheck </dev/null
          go test -count=1 ./.github/scripts/racecheck </dev/null
          go test -count=1 -timeout 1m ./.github/scripts/testcheck </dev/null
          go test -count=1 -timeout 1m ./.github/scripts/modprime </dev/null
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Type-check and regenerate
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
          npm --prefix ui/checkpoint run typecheck </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/highbay/design </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/highbay/design/targetprompt -o internal/targetprompt </dev/null
          (cd examples/orders && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/highbay/examples/orders/design) </dev/null
          (cd examples/orders-eval && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/highbay/examples/orders-eval/design) </dev/null
          node ui/checkpoint/build.mjs --check </dev/null
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from the committed ones:"
            git status --porcelain; git diff --stat; exit 1
          fi

      - name: Test generated page contract consumers
        run: node --test ui/checkpoint/build_test.mjs </dev/null
