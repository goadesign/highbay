# Native integration coverage complements the Linux PR workflow.
# Integration pushes execute every suite; PRs keep native boundary coverage.
name: Integration

on:
  pull_request:
    branches: [team-start, main]
  push:
    # Remove integration branches after they land in their parent.
    branches: [main, team-start, builder-copy]
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: native-ci-${{ github.ref }}-${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

env:
  CI: "true"
  TEMPORAL_CLI_VERSION: 1.7.2
  TEMPORAL_CLI_SHA256: 561ac68bdb6c16c8e8cbbd49f12578218ff1776007c3f3ae0d0196c8c9a73e79
  TEMPORAL_CLI_LINUX_AMD64_SHA256: e2f548af84e820b7d71f25fc6461a4e6a1ab7cdb6a80fde3c375641b0772375b

jobs:
  compiler-inputs:
    name: Full / compiler-inputs (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    # Cold preparation has taken up to fourteen minutes before setup/save.
    # Bound it separately from the unchanged full-test jobs.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: compiler-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Prepare the complete native compiler closure on a cold producer
        if: steps.compiler-cache.outputs.build-hit != 'true' || steps.compiler-cache.outputs.modules-hit != 'true'
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -count=1 -run '^$' -- ./... </dev/null
          CGO_ENABLED=0 go build ./... </dev/null
          go build -o "$RUNNER_TEMP/goa-cache-primer" goa.design/goa/v3/cmd/goa </dev/null
          # Nested modules select their own dependency versions and test
          # profiles. Root ./... never visits these compilation closures.
          for module in story examples/orders examples/orders-eval; do
            (
              cd "$module"
              bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -run '^$' -- ./... </dev/null
            )
          done
          # The scheduled acceptance owner adds files under its e2e tag.
          go -C examples/orders-eval test -race -count=1 -run '^$' -tags=e2e ./acceptance </dev/null
      - name: Save the prepared module archive
        if: steps.compiler-cache.outputs.modules-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.compiler-cache.outputs.modules-dir }}
          key: ${{ steps.compiler-cache.outputs.modules-key }}
      - name: Save the prepared compiler archive
        if: steps.compiler-cache.outputs.build-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.compiler-cache.outputs.build-dir }}
          key: ${{ steps.compiler-cache.outputs.build-key }}


  linux-checks:
    name: Linux checks
    if: github.event_name != 'pull_request'
    needs: compiler-inputs
    uses: ./.github/workflows/ci.yml

  native-platform:
    name: macOS / process and filesystem contracts
    runs-on: macos-latest
    needs: compiler-inputs
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    # This remains a cold/hang backstop; warm execution is measured separately.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Prefetch fixed compiler fixture inputs
        run: |
          GOWORK=off go mod download </dev/null
          GOWORK=off go -C internal/testmodule/testdata/goa-goaai-dsl mod download all </dev/null
          GOWORK=off go -C internal/testmodule/testdata/goa-goaai-evaluator mod download all </dev/null
          GOWORK=off go -C internal/project/testdata/story-fixture mod download all </dev/null
          GOWORK=off go -C internal/project/testdata/story-evaluator mod download all </dev/null
      - name: Run the native process and filesystem contracts
        run: bash .github/scripts/test-native.sh </dev/null

  native-root:
    name: macOS / root-${{ matrix.group }}
    runs-on: macos-latest
    # Existing full-root bounds remain cold/hang backstops, not timing claims.
    needs: compiler-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.compiler-inputs.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [pages-first, pages-remaining, controlplane-first, controlplane-remaining, compiler-first, testwriter-remaining, designeval, cli-first, cli-remaining, other-plain, other-concurrency]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: matrix.group != 'designeval'
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Install page test dependencies
        if: matrix.group != 'designeval'
        run: npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
      - name: Prefetch fixed compiler fixture inputs
        if: matrix.group == 'controlplane-first' || matrix.group == 'controlplane-remaining' || matrix.group == 'other-concurrency'
        env:
          ROOT_GROUP: ${{ matrix.group }}
        run: |
          GOWORK=off go mod download </dev/null
          if [ "$ROOT_GROUP" = controlplane-first ] || [ "$ROOT_GROUP" = controlplane-remaining ]; then
            GOWORK=off go -C internal/testmodule/testdata/goa-goaai-dsl mod download all </dev/null
            GOWORK=off go -C internal/testmodule/testdata/goa-goaai-evaluator mod download all </dev/null
          else
            GOWORK=off go -C internal/project/testdata/story-fixture mod download all </dev/null
            GOWORK=off go -C internal/project/testdata/story-evaluator mod download all </dev/null
          fi
      - name: Run the full root group
        env:
          ROOT_GROUP: ${{ matrix.group }}
        run: |
          bash .github/scripts/test-root.sh "$ROOT_GROUP" </dev/null \
            | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"

  native-small-modules:
    name: macOS / Story and Orders evaluator
    runs-on: macos-latest
    needs: compiler-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.compiler-inputs.result == 'success' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: story-go
        with:
          go-version-file: story/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.story-go.outputs.go-version }}
      - name: Run all Story tests
        working-directory: story
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 3m -json -- ./... </dev/null
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: evaluator-go
        with:
          go-version-file: examples/orders-eval/go.mod
          cache: false
      - name: Run all ordinary Orders evaluator tests
        working-directory: examples/orders-eval
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 20m -json -- ./... </dev/null

  native-orders:
    name: macOS / Orders
    runs-on: macos-latest
    needs: compiler-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.compiler-inputs.result == 'success' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: examples/orders/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Run all ordinary Orders tests
        working-directory: examples/orders
        run: bash "$GITHUB_WORKSPACE/.github/scripts/go-test.sh" -vet=all -count=1 -timeout 20m -json -- ./... </dev/null

  native-generated:
    name: macOS / generated contracts
    runs-on: macos-latest
    needs: compiler-inputs
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.compiler-inputs.result == 'success' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: compiler-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: ui/checkpoint/package-lock.json
      - name: Check production concurrency ownership
        run: |
          bash .github/scripts/go-test_test.sh </dev/null
          go run ./.github/scripts/racecheck </dev/null
          go test -count=1 ./.github/scripts/racecheck </dev/null
          go test -count=1 -timeout 1m ./.github/scripts/testcheck </dev/null
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: Type-check and regenerate
        run: |
          npm ci --prefix ui/checkpoint --no-audit --no-fund </dev/null
          npm --prefix ui/checkpoint run typecheck </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/design </dev/null
          go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/design/targetprompt -o internal/targetprompt </dev/null
          (cd examples/orders && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/examples/orders/design) </dev/null
          (cd examples/orders-eval && go run goa.design/goa/v3/cmd/goa gen github.com/goadesign/surla/examples/orders-eval/design) </dev/null
          node ui/checkpoint/build.mjs --check </dev/null
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files differ from the committed ones:"
            git status --porcelain; git diff --stat; exit 1
          fi

      - name: Test generated page contract consumers
        run: node --test ui/checkpoint/build_test.mjs </dev/null

      - name: Vet the native browser profile
        run: go vet -tags browser ./internal/project </dev/null

  docker-check:
    name: Full / docker-check
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Includes cold compilation, image/module downloads and the eight checks/repairs.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: compiler-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Check the Docker engine
        run: docker version
      - name: Run the dependency-repair journey
        run: |
          go test -race -count=1 -timeout 40m -json -tags=e2e,docker -run '^TestCheckProjectRepairsDependenciesOnOneServer$' ./cmd/surla </dev/null \
            | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"
      - name: Run the container owner's execution and lifecycle contracts
        # These tagged roots exercise the real engine, not the check helper's
        # stand-ins. The journey above ensures their pinned image is available.
        run: |
          go test -race -count=1 -timeout 20m -json -tags=e2e,docker \
            -run '^(TestContainerEngineEndToEnd|TestLocalEngineContainerLifecycleFacts)$' ./verify/candidate </dev/null \
              | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"


  opt-in:
    name: Full / opt-in (Linux)
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Real browser and headless Herdr lifetimes need their native tools.
    # Package alarms exclude setup; hosted timings stay visible.
    timeout-minutes: 10
    env:
      BROWSER_TESTS: '^(TestViewsPageInARealBrowser|TestTeamAndBuildAtPhoneWidth|TestBuildTakingAtDesktopAndPhoneWidth|TestTestsReturnedAtDesktopAndPhoneWidth|TestApprovalFrameAndEvidenceAtDesktopAndPhoneWidth|TestRealBrowserEndsWithItsTest)$'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.0.0
      - name: Require the hosted browser
        # A missing browser is setup failure, rather than skipped native proof.
        run: |
          google-chrome --version </dev/null
          echo "SURLA_TEST_BROWSER=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Install the pinned headless Herdr Core
        run: |
          herdr_archive="$RUNNER_TEMP/herdr-core-linux-x86_64.tar.gz"
          herdr_bin="$RUNNER_TEMP/herdr-bin"
          curl -fsSL --max-time 60 -o "$herdr_archive" \
            https://releases.herdr.dev/core/0.1.21/herdr-core-linux-x86_64.tar.gz </dev/null
          printf '%s  %s\n' '78424755c10a40dde38a0bdb55c20ac19706e9ae05ed68fc2acf1fcff0d941c1' "$herdr_archive" \
            | sha256sum -c -
          mkdir -p "$herdr_bin"
          tar -xzf "$herdr_archive" -C "$herdr_bin" herdr-core
          ln -s herdr-core "$herdr_bin/hc"
          echo "$herdr_bin" >> "$GITHUB_PATH"
      - name: Run the explicit native browser roots
        # TestRealBrowserEndsWithItsTest invokes its child-only helper itself.
        # The harness uses Node's built-in modules and needs no npm packages.
        run: |
          go test -race -count=1 -timeout 5m -json -tags browser \
            -run "$BROWSER_TESTS" ./internal/project </dev/null \
              | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"
      - name: Run the isolated Herdr server lifecycle
        # Require setup explicitly so a missing executable cannot become a skip.
        run: |
          command -v hc
          hc --version </dev/null
          go test -race -count=1 -timeout 5m -json -tags herdr \
            -run '^TestHC$' ./cmd/surla </dev/null \
              | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"


  full:
    name: Full / ${{ matrix.suite }}
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os || 'macos-latest' }}
    # Package alarms exclude compilation and setup; job limits remain backstops.
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: verifier
            module: .
            args: -tags=e2e -run '^Test(RunVerifiesTheOrdersReference|RunGivesWrittenTestsOnlyTheirRunsEnvironment|PrepareUsesCommittedNestedWorkspace|PrepareWrittenSuiteIgnoresBothWorkspaces)$' ./internal/verify
            test_timeout: 20m
            job_timeout: 25
          - suite: verifier-linux
            os: ubuntu-latest
            module: .
            args: -tags=e2e -run '^Test(RunVerifiesTheOrdersReference|RunGivesWrittenTestsOnlyTheirRunsEnvironment|PrepareUsesCommittedNestedWorkspace|PrepareWrittenSuiteIgnoresBothWorkspaces)$' ./internal/verify
            test_timeout: 20m
            job_timeout: 25
          - suite: generation
            module: .
            # Ordinary CLI tests belong to full-root; journey owns its tagged root.
            args: -tags=e2e -run '^Test(GenMatchesGoaGenByteForByte|GenOnAFreshStarterChangesNothingAndKeepsModulesApart|OrdersLiveCopyAppliesADraftThroughTheProjectServer|ProjectBuildCacheNativeLifecycle)$' ./cmd/surla
            test_timeout: 60m
            job_timeout: 70
          - suite: journey
            module: .
            # Three changes through the project server and its team. The first
            # is built, verified, approved, verified and approved again after
            # later tests, and merged by the user with git; the second is
            # refused its build until that merge, then built and dropped; the
            # third is built after the drop. Two verification runs, three
            # build starts and five Story evaluations: about 4 minutes on a
            # developer machine with -race, several times that on this runner.
            # Its package alarm outlasts the test's own 32-minute wait for one
            # verification run by 8 minutes, so a hung run ends with the
            # test's message when the steps before it took less than that.
            args: -tags=e2e -run '^TestWholeJourneyThroughTheProjectServer$' ./cmd/surla
            test_timeout: 40m
            job_timeout: 50
          - suite: starter
            module: .
            args: -tags=scaffold -run '^Test(StarterLiveTargetAppliesADraftToTheNextModelRequest|InitSendsRegisteredPromptReferences|InitBuildsForNamesThatCollideWithTemplatesOrGo|InitCreatesAProjectWhoseSuitePasses)$' ./internal/scaffold
            test_timeout: 60m
            job_timeout: 65
          - suite: orders-acceptance
            module: examples/orders-eval
            args: -tags=e2e -run '^Test(AcceptanceSuite|SeededPayloadBloatFailsTheBudget)$' ./acceptance
            test_timeout: 10m
            job_timeout: 15
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        id: go
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - uses: ./.github/actions/go-cache
        id: compiler-cache
        with:
          go-version: ${{ steps.go.outputs.go-version }}
      - name: Install the Temporal CLI
        # The generation suite's Orders live-copy journey starts Temporal too.
        if: matrix.suite == 'verifier' || matrix.suite == 'verifier-linux' || matrix.suite == 'generation' || matrix.suite == 'orders-acceptance'
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            archive="temporal_cli_${TEMPORAL_CLI_VERSION}_linux_amd64.tar.gz"
            sha256="${TEMPORAL_CLI_LINUX_AMD64_SHA256}"
          else
            archive="temporal_cli_${TEMPORAL_CLI_VERSION}_darwin_arm64.tar.gz"
            sha256="${TEMPORAL_CLI_SHA256}"
          fi
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/temporalio/cli/releases/download/v${TEMPORAL_CLI_VERSION}/$archive"
          echo "${sha256}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/bin" temporal
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the full suite
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          case "$SUITE" in
            verifier|verifier-linux)
              # The verifier owns no production goroutines, sync or channels;
              # its supervising and candidate packages retain race coverage.
              go test -count=1 -timeout ${{ matrix.test_timeout }} -json ${{ matrix.args }} </dev/null \
                | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"
              ;;
            *)
              # Preserve E2E race coverage until paired warm measurements exist.
              go test -race -count=1 -timeout ${{ matrix.test_timeout }} -json ${{ matrix.args }} </dev/null \
                | go run "$GITHUB_WORKSPACE/.github/scripts/testcheck/main.go"
              ;;
          esac
