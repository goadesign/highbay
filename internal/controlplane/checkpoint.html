<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surla</title>
  <style>
/* Surla Architecture Workspace — Operate Mode Tokens & Responsive Layout */
:root {
  color-scheme: light dark;
  --bg-light: #f8fafc;
  --bg-dark: #09090b;
  --fg-light: #09090b;
  --fg-dark: #fafafa;
  --card-light: #ffffff;
  --card-dark: #121215;
  --surface-light: #f1f5f9;
  --surface-dark: #18181b;
  --muted-light: #f1f5f9;
  --muted-dark: #27272a;
  --muted-fg-light: #475569;
  --muted-fg-dark: #a1a1aa;
  --border-light: #e2e8f0;
  --border-dark: #27272a;
  --primary-light: #0f172a;
  --primary-dark: #fafafa;
  --primary-fg-light: #fafafa;
  --primary-fg-dark: #18181b;
  --accent-light: #2563eb;
  --accent-dark: #3b82f6;
  --accent-soft-light: rgba(37, 99, 235, 0.11);
  --accent-soft-dark: rgba(59, 130, 246, 0.2);
  --success-light: #15803d;
  --success-dark: #4ade80;
  --success-soft-light: rgba(21, 128, 61, 0.11);
  --success-soft-dark: rgba(74, 222, 128, 0.18);
  --destructive-light: #dc2626;
  --destructive-dark: #f87171;
  --destructive-soft-light: rgba(220, 38, 38, 0.1);
  --destructive-soft-dark: rgba(248, 113, 113, 0.18);
  --warning-light: #b45309;
  --warning-dark: #fbbf24;
  --warning-soft-light: rgba(180, 83, 9, 0.11);
  --warning-soft-dark: rgba(251, 191, 36, 0.18);

  --background: var(--bg-light);
  --foreground: var(--fg-light);
  --card: var(--card-light);
  --surface: var(--surface-light);
  --muted: var(--muted-light);
  --muted-foreground: var(--muted-fg-light);
  --border: var(--border-light);
  --primary: var(--primary-light);
  --primary-foreground: var(--primary-fg-light);
  --accent: var(--accent-light);
  --accent-soft: var(--accent-soft-light);
  --success: var(--success-light);
  --success-soft: var(--success-soft-light);
  --destructive: var(--destructive-light);
  --destructive-soft: var(--destructive-soft-light);
  --warning: var(--warning-light);
  --warning-soft: var(--warning-soft-light);
  --radius: 0.75rem;

  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  line-height: 1.5;
  background-color: var(--background);
  color: var(--foreground);
  accent-color: var(--accent);
  scrollbar-width: thin;
  scrollbar-color: var(--muted-foreground) transparent;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: var(--bg-dark);
    --foreground: var(--fg-dark);
    --card: var(--card-dark);
    --surface: var(--surface-dark);
    --muted: var(--muted-dark);
    --muted-foreground: var(--muted-fg-dark);
    --border: var(--border-dark);
    --primary: var(--primary-dark);
    --primary-foreground: var(--primary-fg-dark);
    --accent: var(--accent-dark);
    --accent-soft: var(--accent-soft-dark);
    --success: var(--success-dark);
    --success-soft: var(--success-soft-dark);
    --destructive: var(--destructive-dark);
    --destructive-soft: var(--destructive-soft-dark);
    --warning: var(--warning-dark);
    --warning-soft: var(--warning-soft-dark);
  }
}

@supports (color: light-dark(white, black)) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --background: light-dark(var(--bg-light), var(--bg-dark));
    --foreground: light-dark(var(--fg-light), var(--fg-dark));
    --card: light-dark(var(--card-light), var(--card-dark));
    --surface: light-dark(var(--surface-light), var(--surface-dark));
    --muted: light-dark(var(--muted-light), var(--muted-dark));
    --muted-foreground: light-dark(var(--muted-fg-light), var(--muted-fg-dark));
    --border: light-dark(var(--border-light), var(--border-dark));
    --primary: light-dark(var(--primary-light), var(--primary-dark));
    --primary-foreground: light-dark(var(--primary-fg-light), var(--primary-fg-dark));
    --accent: light-dark(var(--accent-light), var(--accent-dark));
    --accent-soft: light-dark(var(--accent-soft-light), var(--accent-soft-dark));
    --success: light-dark(var(--success-light), var(--success-dark));
    --success-soft: light-dark(var(--success-soft-light), var(--success-soft-dark));
    --destructive: light-dark(var(--destructive-light), var(--destructive-dark));
    --destructive-soft: light-dark(var(--destructive-soft-light), var(--destructive-soft-dark));
    --warning: light-dark(var(--warning-light), var(--warning-dark));
    --warning-soft: light-dark(var(--warning-soft-light), var(--warning-soft-dark));
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --background: var(--bg-dark);
  --foreground: var(--fg-dark);
  --card: var(--card-dark);
  --surface: var(--surface-dark);
  --muted: var(--muted-dark);
  --muted-foreground: var(--muted-fg-dark);
  --border: var(--border-dark);
  --primary: var(--primary-dark);
  --primary-foreground: var(--primary-fg-dark);
  --accent: var(--accent-dark);
  --accent-soft: var(--accent-soft-dark);
  --success: var(--success-dark);
  --success-soft: var(--success-soft-dark);
  --destructive: var(--destructive-dark);
  --destructive-soft: var(--destructive-soft-dark);
  --warning: var(--warning-dark);
  --warning-soft: var(--warning-soft-dark);
}

:root[data-theme="light"] {
  color-scheme: light;
  --background: var(--bg-light);
  --foreground: var(--fg-light);
  --card: var(--card-light);
  --surface: var(--surface-light);
  --muted: var(--muted-light);
  --muted-foreground: var(--muted-fg-light);
  --border: var(--border-light);
  --primary: var(--primary-light);
  --primary-foreground: var(--primary-fg-light);
  --accent: var(--accent-light);
  --accent-soft: var(--accent-soft-light);
  --success: var(--success-light);
  --success-soft: var(--success-soft-light);
  --destructive: var(--destructive-light);
  --destructive-soft: var(--destructive-soft-light);
  --warning: var(--warning-light);
  --warning-soft: var(--warning-soft-light);
}

::selection {
  background-color: var(--accent-soft);
  color: var(--foreground);
}

::placeholder {
  color: var(--muted-foreground);
  opacity: 0.85;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 0.85rem 1.15rem 1.5rem;
  background-color: var(--background);
  color: var(--foreground);
}
#surla-checkpoint-root {
  max-width: 84rem;
  margin: 0 auto;
}
header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.65rem 1rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
  margin-bottom: 0.65rem;
}
.surla-header-brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
}
.surla-brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.85rem;
  height: 1.85rem;
  border-radius: 0.45rem;
  background: var(--primary);
  color: var(--primary-foreground);
  font-weight: 700;
  font-size: 0.92rem;
  flex-shrink: 0;
}
.surla-header-copy {
  min-width: 0;
}
.surla-header-copy p {
  font-size: 0.84rem;
  color: var(--muted-foreground);
  max-inline-size: 72ch;
}
h1 { font-size: 1.18rem; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.15rem 0; }
h2 { font-size: 1.02rem; font-weight: 600; letter-spacing: -0.015em; margin: 0 0 0.4rem 0; }
h3 { font-size: 0.9rem; font-weight: 600; letter-spacing: -0.01em; margin: 0.85rem 0 0.35rem 0; }
h4 { font-size: 0.85rem; font-weight: 600; margin: 0.6rem 0 0.25rem 0; }
p { margin: 0.25rem 0; max-inline-size: 75ch; }
#surla-checkpoint-status {
  font-size: 0.82rem;
  color: var(--muted-foreground);
  margin: 0.25rem 0 0.6rem 0;
  overflow-wrap: anywhere;
}
code, pre {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
}
code {
  background: var(--muted);
  padding: 0.1rem 0.35rem;
  border-radius: 4px;
  overflow-wrap: anywhere;
  word-break: break-word;
}
pre {
  background: var(--muted);
  padding: 0.65rem;
  border-radius: calc(var(--radius) - 4px);
  border: 1px solid var(--border);
  overflow-x: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
ul { margin: 0.35rem 0; padding-left: 1.25rem; }
li { margin-bottom: 0.35rem; }

/* Cards use a single 1px border elevation per craft-floor. */
.shadcn-card, .surla-meta, .surla-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.95rem 1.1rem;
  margin-bottom: 0.85rem;
  overflow-wrap: anywhere;
}
.shadcn-card-header { margin-bottom: 0.65rem; }
.shadcn-card-title { font-size: 1rem; font-weight: 600; letter-spacing: -0.015em; margin: 0; }
.shadcn-card-desc { font-size: 0.84rem; color: var(--muted-foreground); margin-top: 0.2rem; max-inline-size: 75ch; }

/* Workspace navigation bar & truthful displayed-subject context strip. */
#surla-checkpoint-nav:not([hidden]) {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 0.35rem 0 0.85rem 0;
  padding: 0.55rem 0.7rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.surla-workspace-context {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem 0.65rem;
  align-items: center;
  padding-top: 0.45rem;
  border-top: 1px solid var(--border);
  font-size: 0.81rem;
}
.surla-subject-item {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem 0.5rem;
  padding: 0.22rem 0.55rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 4px);
  min-width: 0;
}
.surla-subject-role {
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--muted-foreground);
}
.surla-subject-title {
  font-weight: 600;
  color: var(--foreground);
}
.surla-subject-meta {
  color: var(--muted-foreground);
  font-variant-numeric: tabular-nums;
}

/* Split workspace view when a protected editor and another result are both mounted. */
#surla-checkpoint-view {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.9rem;
  align-items: start;
}
@media (min-width: 1040px) {
  #surla-checkpoint-view.surla-split-workspace {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
}

.surla-region-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 0.75rem;
  margin-bottom: 0.65rem;
  padding-bottom: 0.55rem;
  border-bottom: 1px solid var(--border);
}
.surla-region-title-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.55rem;
  min-width: 0;
}
.surla-toolbar-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
}

/* Architecture preview 2-column inspector grid. */
.surla-arch-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 0.85rem;
  margin-top: 0.65rem;
}
@media (min-width: 860px) {
  .surla-arch-grid {
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  }
}
.surla-panel-section {
  padding: 0.75rem 0.85rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 3px);
}
.surla-panel-section h3 {
  margin-top: 0;
}
.surla-compact-list {
  list-style: none;
  padding: 0;
  margin: 0.4rem 0 0 0;
}
.surla-compact-list > li {
  padding: 0.45rem 0;
  border-top: 1px solid var(--border);
  margin: 0;
}
.surla-compact-list > li:first-child {
  border-top: none;
  padding-top: 0.1rem;
}

/* Verification counts wrap as ordinary reading text at narrow widths. */
.surla-verification-counts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
  gap: 0.5rem 1rem;
  margin: 0.75rem 0;
  padding: 0.65rem 0.8rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 3px);
}
.surla-verification-counts dt { font-size: 0.8rem; color: var(--muted-foreground); }
.surla-verification-counts dd { margin: 0; font-size: 0.95rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.surla-verification-details dt { font-weight: 600; margin-top: 0.5rem; font-size: 0.82rem; }
.surla-verification-details dd { margin: 0.1rem 0 0; font-size: 0.82rem; }
.surla-verification-scenarios {
  list-style: none;
  padding: 0;
  margin: 0.5rem 0;
}
.surla-verification-scenarios > li {
  padding: 0.6rem 0.75rem;
  margin-bottom: 0.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 3px);
}

/* Diagnostics use a separate inline region, leaving the editable card intact. */
.surla-trace-view { margin: 0.35rem 0 0.7rem; }
.surla-trace-panel {
  margin-top: 0.55rem;
  padding: 0.85rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.surla-trace-panel h2 { margin-top: 0; }
.surla-trace-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; margin-block: 0.5rem; }
.surla-trace-list { list-style: none; margin: 0.75rem 0; padding: 0; }
.surla-trace-list > li { padding-block: 0.75rem; border-top: 1px solid var(--border); overflow-wrap: anywhere; }
.surla-trace-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.35rem 1rem; }
.surla-trace-heading strong { min-width: 0; overflow-wrap: anywhere; }
.surla-trace-heading > span { font-size: 0.83rem; font-variant-numeric: tabular-nums; }
.surla-trace-panel > p, .surla-trace-list > li > p { max-inline-size: 75ch; }
.surla-trace-details dt { font-weight: 600; margin-top: 0.4rem; }
.surla-trace-details dd { margin: 0.15rem 0; }

.shadcn-badge, .surla-badge {
  display: inline-flex;
  align-items: center;
  max-width: 100%;
  padding: 0.14rem 0.52rem;
  border-radius: 9999px;
  border: 1px solid var(--border);
  font-size: 0.75rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-right: 0.35rem;
  background: var(--muted);
  color: var(--foreground);
  overflow-wrap: anywhere;
  word-break: break-word;
  white-space: normal;
}
.shadcn-badge-accent { border-color: var(--accent); background: var(--accent-soft); }
.shadcn-badge-success { border-color: var(--success); background: var(--success-soft); }
.shadcn-badge-warning { border-color: var(--warning); background: var(--warning-soft); }
.shadcn-badge-destructive { border-color: var(--destructive); background: var(--destructive-soft); }

.shadcn-btn, .surla-pill, .surla-btn {
  -webkit-appearance: none;
  appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3rem;
  min-block-size: 1.9rem;
  padding: 0.32rem 0.75rem;
  margin: 0.18rem 0.35rem 0.18rem 0;
  border-radius: calc(var(--radius) - 4px);
  border: 1px solid var(--border);
  background-color: var(--card);
  color: var(--foreground);
  cursor: pointer;
  font-size: 0.83rem;
  font-weight: 500;
  transition: background-color 150ms ease-out, border-color 150ms ease-out;
}
.shadcn-btn:hover:not(:disabled), .surla-pill:hover:not(:disabled), .surla-btn:hover:not(:disabled) {
  background-color: var(--muted);
}
.shadcn-btn:focus-visible, .surla-pill:focus-visible, .surla-input:focus-visible, .surla-table-wrap:focus-visible, .surla-graph-wrap:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.shadcn-btn:disabled, .surla-pill:disabled, .surla-input:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.surla-pill[aria-pressed="true"], .surla-pill[aria-current="page"], .surla-btn-primary, .shadcn-btn-primary {
  border-color: var(--accent);
  background-color: var(--accent-soft);
  color: var(--foreground);
  font-weight: 600;
}
#surla-cp4-run-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin: 0.5rem 0;
}

.surla-field-row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-start; margin: 0.4rem 0; }
/* The display rule above would otherwise override the hidden attribute. */
.surla-field-row[hidden] { display: none; }
.surla-field-label { display: flex; flex-direction: column; gap: 0.22rem; flex: 1 1 12rem; font-size: 0.82rem; font-weight: 500; }
.surla-input {
  width: 100%;
  min-block-size: 1.95rem;
  padding: 0.38rem 0.55rem;
  border-radius: calc(var(--radius) - 4px);
  border: 1px solid var(--border);
  background: var(--background);
  color: var(--foreground);
  font-family: inherit;
  font-size: 0.85rem;
  resize: vertical;
}
.surla-example-card {
  padding: 0.7rem 0.8rem;
  margin-bottom: 0.55rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 3px);
}

.shadcn-alert {
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 2px);
  padding: 0.75rem 0.9rem;
  margin: 0.55rem 0;
  background: var(--surface);
}
.shadcn-alert-warning { border-color: var(--warning); background: var(--warning-soft); }
.shadcn-alert-destructive, .surla-error {
  border: 1px solid var(--destructive);
  background: var(--destructive-soft);
  border-radius: calc(var(--radius) - 2px);
  padding: 0.75rem 0.9rem;
  margin-top: 0.5rem;
}

.surla-graph-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 2px);
  padding: 0.65rem;
  margin: 0.5rem 0 0.75rem 0;
  background: var(--background);
}
#surla-c4-svg text { fill: currentColor; }

/* Responsive table with container queries (modern-web-guidance: responsive-table) */
.surla-table-wrap {
  overflow: auto;
  max-inline-size: 100%;
  container-type: inline-size;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 2px);
  margin: 0.5rem 0;
}
.shadcn-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.84rem;
}
.shadcn-table th, .shadcn-table td {
  padding: 0.5rem 0.65rem;
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.shadcn-table thead th {
  position: sticky;
  inset-block-start: 0;
  z-index: 1;
  background: var(--muted);
  font-weight: 600;
}
.shadcn-table tbody th {
  position: sticky;
  inset-inline-start: 0;
  background: var(--card);
  font-weight: 600;
}
@container (width < 520px) {
  .shadcn-table, .shadcn-table thead, .shadcn-table tbody, .shadcn-table tr, .shadcn-table th, .shadcn-table td {
    display: block;
  }
  .shadcn-table thead { display: none; }
  .shadcn-table tr { border-bottom: 1px solid var(--border); padding: 0.35rem 0; }
  .shadcn-table td[data-label]::before {
    content: attr(data-label) ": ";
    font-weight: 600;
    color: var(--muted-foreground);
  }
}

.shadcn-cell-active { background: var(--accent-soft); font-weight: 600; }
.shadcn-timeline, .surla-timeline {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin: 0.5rem 0;
  padding-left: 0;
  list-style: none;
}
.shadcn-timeline-step, .surla-timeline-step {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  padding: 0.55rem 0.7rem;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: calc(var(--radius) - 3px);
}
.surla-details {
  margin-top: 0.45rem;
  font-size: 0.81rem;
  color: var(--muted-foreground);
}
.surla-details > summary {
  display: inline-flex;
  align-items: center;
  gap: 0.3rem;
  padding: 0.2rem 0.4rem;
  border-radius: 4px;
  color: var(--foreground);
  font-weight: 500;
}
.surla-details > summary:hover {
  background: var(--muted);
}
summary { cursor: pointer; font-weight: 500; user-select: none; }

/* Story stage: flows are rows; a flow's steps are cards in a row that
   scrolls inside the stage, so long flows never widen the page. */
.surla-story-stage h5 { font-size: 0.84rem; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
/* Read by assistive technology, not shown. */
.surla-visually-hidden {
  position: absolute;
  inline-size: 1px;
  block-size: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.surla-story-stage { min-width: 0; }
.surla-story-stage section + section { margin-top: 1rem; }
.surla-story-section { min-width: 0; }
.surla-story-muted { color: var(--muted-foreground); font-size: 0.82rem; }
.surla-story-flows { list-style: none; padding-left: 0; margin: 0.4rem 0; display: grid; gap: 0.7rem; }
.surla-story-flow {
  min-width: 0;
  padding: 0.6rem 0.7rem;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 3px);
  background: var(--surface);
  overflow-wrap: anywhere;
}
.surla-story-flow[data-complete="false"] { border-style: dashed; border-color: var(--warning); }
.surla-story-flow-header { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.6rem; }
.surla-story-reasons { margin: 0.3rem 0; font-size: 0.82rem; }
.surla-story-steps {
  display: flex;
  gap: 0.5rem;
  list-style: none;
  padding: 0.2rem 0 0.4rem 0;
  margin: 0.45rem 0 0.2rem 0;
  overflow-x: auto;
  max-inline-size: 100%;
}
.surla-story-steps:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.surla-story-step {
  flex: 0 0 13.5rem;
  min-width: 0;
  margin: 0;
  padding: 0.5rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: calc(var(--radius) - 4px);
  background: var(--card);
  overflow-wrap: anywhere;
}
.surla-story-step[data-kind="start"] { border-top: 3px solid var(--accent); }
.surla-story-step[data-kind="outcome"] { border-bottom: 3px solid var(--success); }
.surla-story-actor { display: block; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted-foreground); }
.surla-story-summary { margin: 0.2rem 0; }
.surla-story-kind { display: inline-block; font-size: 0.72rem; color: var(--muted-foreground); }
.surla-story-questions { margin: 0.35rem 0 0 0; font-size: 0.82rem; }
.surla-story-options { margin: 0.15rem 0; }
#surla-story-draft-diagnostic { max-block-size: 18rem; overflow: auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* Live target view: prompt identifiers, versions, addresses and server
   messages can be long, so they wrap inside the card instead of widening
   the page at phone width. */
.surla-live-wrap,
.surla-live-wrap code,
.surla-live-wrap a {
  overflow-wrap: anywhere;
  word-break: break-word;
  min-width: 0;
}
.surla-live-prompts { margin: 0.4rem 0; padding-inline-start: 1.2rem; }
.surla-live-prompts > li { margin-block: 0.25rem; }

/* Build keeps the shared card width; state and actions share its header and
   wrap in source order at narrow widths. Commands scroll only within pre. */
.surla-build-header { flex-wrap: wrap; align-items: center; }
.surla-build-header h3 { margin-inline-end: auto; }
.surla-build-badges { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.surla-build-header .surla-build-actions { margin: 0; }
.surla-build-roles { list-style: none; padding-inline-start: 0; }
.surla-build-roles li { margin-block: 0.2rem; }
.surla-build-roles p { margin-block: 0; }
.surla-build-actions { margin-block: 0.75rem; }
.surla-build-merge ol { padding-inline-start: 1.25rem; }
.surla-build-merge li { min-inline-size: 0; margin-block-end: 0.75rem; }
.surla-build-merge pre { margin-block: 0.4rem 0.25rem; white-space: pre; overflow-wrap: normal; }
.surla-build-merge pre code { padding: 0; background: transparent; white-space: pre; overflow-wrap: normal; word-break: normal; }
.surla-build-merge li p { font-size: 0.875rem; color: var(--muted-foreground); }

/* Layout B: the fixed Surla surface owns orientation and the deciding action. */
:root {
  --surla-space-1: 4px;
  --surla-space-2: 8px;
  --surla-space-3: 12px;
  --surla-space-4: 16px;
  --surla-space-5: 24px;
}
html { scroll-padding-block-start: calc(var(--surla-frame-height, 120px) + 16px); }
.surla-skip-link {
  position: fixed; inset-block-start: 8px; inset-inline-start: 12px;
  transform: translateY(-180%); z-index: 50; padding: 8px 12px;
  background: var(--card); color: var(--foreground); border: 1px solid var(--border);
}
.surla-skip-link:focus { transform: translateY(0); }
#surla-checkpoint-nav:not([hidden]) {
  position: sticky; inset-block-start: 0; z-index: 30;
  margin: -0.85rem -0.15rem 16px; padding: 0;
  border: 0; border-block-end: 1px solid var(--border); border-radius: 0;
  background: var(--card);
}
.surla-fixed-frame { font-size: 13px; line-height: 18px; }
.surla-frame-where {
  display: grid; grid-template-columns: minmax(110px, 1fr) auto auto;
  gap: 8px 16px; align-items: center; padding: 8px 12px;
}
.surla-frame-project {
  display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px;
  min-inline-size: 0; margin: 0; font-size: 13px; line-height: 18px;
  letter-spacing: normal; overflow-wrap: anywhere;
}
.surla-frame-project > span:first-child { font-weight: 700; }
.surla-frame-project > span:nth-child(2) { color: var(--muted-foreground); }
.surla-frame-journey, .surla-frame-references { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.surla-fixed-frame .surla-btn {
  min-block-size: 30px; padding: 4px 10px; border-radius: 4px;
  font-size: 13px; line-height: 18px; white-space: normal;
}
.surla-frame-journey .surla-btn { border-color: transparent; background: transparent; }
.surla-frame-journey [aria-current="step"] { color: var(--accent); border-block-end-color: var(--accent); border-radius: 0; }
.surla-frame-references .surla-btn { background: transparent; }
.surla-frame-slots {
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(170px, auto);
  margin: 0; padding: 12px; gap: 16px; border-block-start: 1px solid var(--border);
}
.surla-frame-slots > div { min-inline-size: 0; }
.surla-frame-slots dt { font-size: 12px; color: var(--muted-foreground); margin-block-end: 4px; }
.surla-frame-slots dd { margin: 0; overflow-wrap: anywhere; }
.surla-frame-next dd { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
#surla-frame-next .surla-btn-primary {
  background-color: var(--primary); color: var(--primary-foreground); border-color: var(--primary);
}
.surla-frame-action-binding { font-size: 12px; color: var(--muted-foreground); }
.surla-frame-context { padding: 0 12px 8px; font-size: 12px; }
.surla-frame-context summary { color: var(--muted-foreground); cursor: pointer; }
.surla-frame-context .surla-workspace-context { margin-block-start: 8px; font-size: 12px; }
.surla-frame-project-menu { position: relative; justify-self: end; }
.surla-frame-project-menu > summary {
  padding: 10px 12px; min-block-size: 44px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 4px;
}
.surla-frame-project-menu .surla-frame-references {
  position: absolute; inset-inline-end: 0; inset-block-start: calc(100% + 4px);
  z-index: 35; inline-size: min(260px, 85vw); padding: 8px;
  background: var(--card); border: 1px solid var(--border); border-radius: 6px;
}
.surla-approval-stage { min-inline-size: 0; font-size: 14px; line-height: 1.5; padding: 8px 0 24px; }
.surla-approval-stage h2 { font-size: 18px; line-height: 1.4; margin: 0 0 8px; }
.surla-approval-stage h3 { font-size: 14px; margin: 24px 0 8px; }
.surla-approval-stage h4 { font-size: 13px; margin: 16px 0 8px; }
.surla-approval-heading { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; }
.surla-approval-heading p { color: var(--muted-foreground); margin: 0; }
.surla-approval-binding { display: flex; flex-wrap: wrap; gap: 12px 24px; margin: 16px 0; padding-block: 12px; border-block: 1px solid var(--border); }
.surla-approval-binding dt { color: var(--muted-foreground); font-size: 12px; }
.surla-approval-binding dd { margin: 4px 0 0; }
.surla-approval-evidence { display: grid; grid-template-columns: minmax(0, 2fr) minmax(250px, 1fr); gap: 24px; align-items: start; }
.surla-approval-evidence > * { min-inline-size: 0; }
.surla-approval-basis { padding-inline-start: 24px; border-inline-start: 1px solid var(--border); }
.surla-approval-notice { padding: 12px 0; color: var(--muted-foreground); }
.surla-approval-exclusions { margin-block: 24px; padding-block: 0 16px; border-block-end: 1px solid var(--border); }
.surla-flow-evidence { inline-size: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.surla-flow-evidence th, .surla-flow-evidence td { text-align: start; vertical-align: top; padding: 12px 8px; border-block-end: 1px solid var(--border); overflow-wrap: anywhere; }
.surla-flow-evidence thead th { font-size: 12px; color: var(--muted-foreground); font-weight: 500; }
.surla-flow-evidence th:first-child { inline-size: 49%; padding-inline-start: 0; }
.surla-flow-evidence th:last-child { inline-size: 21%; }
.surla-flow-evidence tbody th { font-weight: 400; }
.surla-flow-evidence tbody th p { font-size: 13px; color: var(--muted-foreground); margin-block-start: 4px; }
.surla-approval-stage [data-outcome="passed"] { color: var(--success); }
.surla-approval-stage [data-outcome="failed"] { color: var(--destructive); }
.surla-approval-stage [data-outcome="not_run"], .surla-approval-stage [data-outcome="harness_error"] { color: var(--warning); }
.surla-approval-test-list { list-style: none; padding: 0; }
.surla-approval-test-list li { display: flex; justify-content: space-between; gap: 12px; padding-block: 8px; border-block-end: 1px solid var(--border); }
.surla-approval-basis dl { margin: 12px 0; }
.surla-approval-basis dt { margin-block-start: 12px; color: var(--muted-foreground); font-size: 12px; }
.surla-approval-basis dd { margin: 4px 0 0; }
.surla-approval-basis pre { white-space: pre; overflow-wrap: normal; max-inline-size: 100%; }
.surla-approval-stage .surla-details > summary { display: list-item; padding: 4px 0; }
.surla-approval-stage :focus-visible, .surla-fixed-frame :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1100px) {
  .surla-frame-where { grid-template-columns: minmax(0, 1fr) auto; }
  .surla-frame-journey { grid-row: 2; grid-column: 1 / -1; }
  .surla-approval-evidence { grid-template-columns: minmax(0, 1fr); }
  .surla-approval-basis { border-inline-start: 0; border-block-start: 1px solid var(--border); padding: 8px 0 0; }
  .surla-approval-basis > h3 { margin-block-start: 0; }
  .surla-approval-evidence { gap: 16px; }
  .surla-approval-test-list { margin-block-end: 0; }
  .surla-approval-test-list li:last-child { border-block-end: 0; }
  .surla-approval-evidence > div > section:last-child { margin-block-end: 0; padding-block-end: 0; border-block-end: 0; }
}
@media (max-width: 720px) {
  body { padding-inline: 12px; padding-block-end: calc(var(--surla-next-height, 110px) + 24px); }
  #surla-checkpoint-nav:not([hidden]) { position: relative; margin-inline: -12px; }
  html { scroll-padding-block-start: 12px; }
  .surla-frame-where { gap: 4px 8px; padding: 4px 12px; }
  .surla-fixed-frame .surla-btn, .surla-approval-stage .surla-btn { min-block-size: 44px; padding: 10px 12px; }
  .surla-frame-journey { flex-wrap: wrap; gap: 0; }
  .surla-frame-journey .surla-btn { flex: 1; padding-inline: 6px; }
  .surla-frame-slots { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .surla-frame-next {
    position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 40;
    display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-block-start: 1px solid var(--border);
  }
  .surla-frame-next dt { margin: 0; }
  .surla-frame-next dd { justify-content: flex-end; }
  .surla-frame-action-binding { white-space: nowrap; }
  .surla-approval-binding { gap: 12px; }
  .surla-flow-evidence, .surla-flow-evidence tbody { display: block; }
  .surla-flow-evidence thead { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); }
  .surla-flow-evidence tbody tr { display: block; padding-block: 12px; border-block-end: 1px solid var(--border); }
  .surla-flow-evidence tbody th, .surla-flow-evidence tbody td { display: block; inline-size: 100%; padding: 4px 0; border: 0; }
  .surla-flow-evidence tbody th:first-child { inline-size: 100%; }
  .surla-flow-evidence td::before { content: attr(data-label) ": "; color: var(--muted-foreground); }
}
@media (prefers-reduced-motion: reduce) {
  .surla-fixed-frame *, .surla-approval-stage * { scroll-behavior: auto; transition: none; }
}
